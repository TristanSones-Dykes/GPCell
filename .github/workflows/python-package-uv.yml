name: Python package with generated docs

on: [push]

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -e ".[ci]"

      - name: Lint with Ruff
        run: |
          .venv/bin/ruff check --select E9,F63,F7,F82 .

      - name: Check Ruff formatting
        run: |
          .venv/bin/ruff format --check gpcell tests

      - name: Compile pdoc
        run: |
          .venv/bin/pdoc --docformat numpy -o docs gpcell

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          name: gpcell-pages
          path: docs/
          retention-days: 10

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: gpcell-pages
    steps:
      - name: Deploy GitHub Pages site
        uses: actions/deploy-pages@v4.0.5
        with:
          token: ${{ github.token }}
          artifact_name: gpcell-pages
